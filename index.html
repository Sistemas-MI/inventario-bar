      <td style="font-weight:500">${sp.name}<br><span style="font-size:10px;color:var(--txt3);font-weight:400">${(sp.product_type||'').toUpperCase()}</span></td>
      <td><span style="background:var(--bg2);border-radius:5px;padding:2px 6px;font-size:11px">${sp.cat}</span></td>
      <td style="text-align:center">${barra.toFixed(2)}</td>
      <td style="text-align:center">${bodega.toFixed(2)}</td>
      <td style="text-align:center;font-weight:500">${total.toFixed(2)}</td>
      <td style="text-align:center">${Math.round(pct*100)}%</td>
      <td><span class="badge ${isZero?'b-zero':'b-crit'}">${isZero?'Agotado':'Bajo'}</span></td>
      <td style="text-align:center;font-weight:500;color:var(--burg)">${suggestion.qty>0?suggestion.qty+' und.':'—'}${suggestedNote}</td>
    </tr>`;
  }).join('')||`<tr><td colspan="8" class="empty">Todo el inventario está en buen nivel — nada que comprar por ahora</td></tr>`;

  // ── RANKING DE CONSUMO — todos los productos, histórico permanente, por nombre
  const consumptionRanking=[...spirits]
    .map(sp=>({sp, total:getTotalConsumedBottles(sp)}))
    .filter(r=>r.total>0)
    .sort((a,b)=>b.total-a.total);
  const maxConsumo=consumptionRanking[0]?.total||1;
  const rankingRows=consumptionRanking.map((r,i)=>{
    const pct=Math.min(100,Math.round((r.total/maxConsumo)*100));
    const isPiece=r.sp.product_type==='cerveza'||r.sp.product_type==='agua'||r.sp.product_type==='refrescos';
    const bd=getConsumptionBreakdown(r.sp);
    const bdLines=[];
    // Cóctel: se detalla EN QUÉ recetas específicas, no solo el total.
    // Si son muchas (botella muy versátil), se recorta igual que ya se
    // hace en el aviso de "Reporte de compras" (top 5 + "y N más").
    const cocktailNames=Object.keys(bd.cocteles);
    if(cocktailNames.length){
      const sortedNames=cocktailNames.sort((a,b)=>bd.cocteles[b].qty-bd.cocteles[a].qty);
      const cocktailParts=sortedNames.slice(0,5).map(name=>`${name} (${bd.cocteles[name].qty})`);
      const extra=sortedNames.length>5?`… y ${sortedNames.length-5} más`:'';
      bdLines.push(`<div style="font-size:10px;color:var(--txt3);margin-top:2px">Cóctel: ${cocktailParts.join(', ')}${extra}</div>`);
    }
    // Shot / copa / botella / pieza: consumo directo de la botella, sin receta de por medio
    const directParts=[];
    if(bd.shot>0) directParts.push(`Shot: ${fmx(Math.round(bd.shot))}ml`);
    if(bd.copa>0) directParts.push(`Copa: ${fmx(Math.round(bd.copa))}ml`);
    if(bd.botella>0) directParts.push(`Botella: ${bd.botella.toFixed(0)} und`);
    if(bd.pieza>0) directParts.push(`Pieza: ${bd.pieza.toFixed(0)} und`);
    if(directParts.length) bdLines.push(`<div style="font-size:10px;color:var(--txt3);margin-top:2px">${directParts.join(' · ')}</div>`);
    const bdHTML=bdLines.join('');
    return`<tr>
      <td style="text-align:center;color:var(--txt3);font-weight:500">${i+1}</td>
      <td style="font-weight:500">${r.sp.name}${bdHTML}</td>
      <td><span style="background:var(--bg2);border-radius:5px;padding:2px 6px;font-size:11px">${r.sp.cat}</span></td>
      <td style="min-width:140px">
        <div style="display:flex;align-items:center;gap:8px">
          <div class="prog" style="flex:1"><div class="prog-fill" style="width:${pct}%;background:var(--accent)"></div></div>
          <span style="font-size:12px;font-weight:500;color:var(--burg);white-space:nowrap">${r.total.toFixed(2)} ${isPiece?'pzas':'btl'}</span>
        </div>
      </td>
    </tr>`;
  }).join('')||`<tr><td colspan="4" class="empty">Aún no hay ventas registradas</td></tr>`;

  // ── Weeks & months for filter dropdowns
  const allWeeks=[...new Set(reportHistory.map(s=>s.week).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  const allMonths=[...new Set(reportHistory.map(s=>{
    const d=s.created_at?new Date(s.created_at):null;
    return d?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`:null;
  }).filter(Boolean))].sort();

  const weekOpts=allWeeks.map(w=>`<option value="${w}"${_repFilterWeek===w?' selected':''}>${w}</option>`).join('');
  const monthOpts=allMonths.map(m=>{
    const [y,mo]=m.split('-');
    const lbl=new Date(+y,+mo-1,1).toLocaleString('es-MX',{month:'long',year:'numeric'});
    return`<option value="${m}"${_repFilterMonth===m?' selected':''}>${lbl}</option>`;
  }).join('');

  // ── KPIs
  const totalOps=filtered.reduce((t,s)=>t+(s.qty||1),0);
  const totalMLAll=filtered.reduce((t,s)=>{
    const mode=s.sale_mode||'coctel';
    if(mode==='coctel'){
      const r=recipes.find(r=>r.id===s.cocktail_id);
      if(!r) return t;
      return t+r.ings.reduce((m,i)=>m+(s.qty||1)*i.ml,0);
    }
    if(mode==='shot') return t+(s.qty||1)*60;
    if(mode==='copa') return t+(s.qty||1)*150;
    if(mode==='botella'||mode==='pieza'){
      const sp=spirits.find(x=>x.id===s.cocktail_id);
      return t+(sp?(s.qty||1)*sp.ml:0);
    }
    return t;
  },0);

  // ── By mode
  const byMode={};
  filtered.forEach(s=>{
    const m=s.sale_mode||'coctel';
    byMode[m]=(byMode[m]||0)+(s.qty||1);
  });

  // ── By category (ml) — incluye todos los modos
  const byCat={};
  filtered.forEach(s=>{
    const mode=s.sale_mode||'coctel';
    if(mode==='coctel'){
      const r=recipes.find(r=>r.id===s.cocktail_id);
      if(!r) return;
      r.ings.forEach(i=>{
        const sp=spirits.find(x=>x.id===i.id);
        if(!sp) return;
        byCat[sp.cat]=(byCat[sp.cat]||0)+(s.qty||1)*i.ml;
      });
    } else {
      // shot, copa, botella, pieza — todos usan cocktail_id como spirit id
      const sp=spirits.find(x=>x.id===s.cocktail_id);
      if(!sp) return;
      let ml=0;
      if(mode==='shot') ml=60;
      else if(mode==='copa') ml=150;
      else if(mode==='botella') ml=sp.ml;
      else if(mode==='pieza') ml=sp.ml; // pieza: descuenta unidad completa
      byCat[sp.cat]=(byCat[sp.cat]||0)+(s.qty||1)*ml;
    }
  });

  // ── By product (top 8) — incluye todos los modos
  const byProduct={};
  filtered.forEach(s=>{
    const mode=s.sale_mode||'coctel';
    let name='?', mlVal=0;
    if(mode==='coctel'){
      const r=recipes.find(r=>r.id===s.cocktail_id);
      if(!r) return;
      name=r.name;
      mlVal=r.ings.reduce((m,i)=>m+(s.qty||1)*i.ml,0);
    } else {
      const sp=spirits.find(x=>x.id===s.cocktail_id);
      if(!sp) return;
      name=sp.name;
      if(mode==='shot') mlVal=(s.qty||1)*60;
      else if(mode==='copa') mlVal=(s.qty||1)*150;
      else if(mode==='botella'||mode==='pieza') mlVal=(s.qty||1)*sp.ml;
    }
    if(!byProduct[name]) byProduct[name]={qty:0,ml:0,mode};
    byProduct[name].qty+=(s.qty||1);
    byProduct[name].ml+=mlVal;
  });
  // ── Top de cócteles (solo sale_mode === 'coctel') — para la tarjeta
  // "Top de cócteles", que ya no mezcla shots/copas/botellas/piezas.
  const byCocktail={};
  filtered.forEach(s=>{
    if((s.sale_mode||'coctel')!=='coctel') return;
    const r=recipes.find(r=>r.id===s.cocktail_id);
    if(!r) return;
    if(!byCocktail[r.name]) byCocktail[r.name]={qty:0,ml:0};
    byCocktail[r.name].qty+=(s.qty||1);
    byCocktail[r.name].ml+=r.ings.reduce((m,i)=>m+(s.qty||1)*i.ml,0);
  });
  const topCocktails=Object.entries(byCocktail).sort((a,b)=>b[1].ml-a[1].ml).slice(0,8);
  const maxCocktailML=topCocktails[0]?.[1].ml||1;

  // ── By week (for timeline bar)
  const byWeek={};
  filtered.forEach(s=>{
    const w=s.week||'Sin semana';
    byWeek[w]=(byWeek[w]||0)+(s.qty||1);
  });
  const weekEntries=Object.entries(byWeek).sort((a,b)=>a[0].localeCompare(b[0],undefined,{numeric:true}));
  const maxWkQty=Math.max(...weekEntries.map(e=>e[1]),1);

  // ── Mode colors reuse
  const modeColors={coctel:'#3C3489',shot:'#D85A30',copa:'#276749',botella:'#3B6D11',pieza:'#1565C0'};
  const modeLabels={coctel:'Cócteles',shot:'Shots',copa:'Copas',botella:'Botellas',pieza:'Piezas'};

  // ── History table rows — muestra ml consumidos por esa venta específica
  const histRows=filtered.slice(0,100).map(s=>{
    const mode=s.sale_mode||'coctel';
    let name='?', mlDetail='';

    if(mode==='coctel'){
      const r=recipes.find(r=>r.id===s.cocktail_id);
      name=r?r.name:'?';
      if(r){
        const totalML=r.ings.reduce((m,i)=>m+(s.qty||1)*i.ml,0);
        const ingParts=r.ings.slice(0,3).map(i=>{
          const sp=spirits.find(x=>x.id===i.id);
          return sp?`${sp.name.split(' ')[0]} −${(s.qty||1)*i.ml}ml`:'';
        }).filter(Boolean).join(' · ');
        mlDetail=`<span style="font-size:11px;color:var(--burg);font-weight:500">${fmx(totalML)} ml total</span>`
          +`<br><span style="font-size:10px;color:var(--txt3)">${ingParts}</span>`;
      }
    } else {
      const sp=spirits.find(x=>x.id===s.cocktail_id);
      name=sp?sp.name:'?';
      let mlPorUnidad=0;
      if(mode==='shot') mlPorUnidad=60;
      else if(mode==='copa') mlPorUnidad=150;
      else if(mode==='botella'||mode==='pieza') mlPorUnidad=sp?sp.ml:0;
      const totalML=(s.qty||1)*mlPorUnidad;
      const unidadLabel=mode==='pieza'?'pieza':'unidad';
      mlDetail=`<span style="font-size:11px;color:var(--burg);font-weight:500">${fmx(totalML)} ml total</span>`
        +`<br><span style="font-size:10px;color:var(--txt3)">${s.qty||1} ${unidadLabel}${(s.qty||1)>1?'s':''} × ${fmx(mlPorUnidad)} ml</span>`;
    }

    const date=s.created_at?new Date(s.created_at).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}):'—';

    return`<tr>
      <td style="font-weight:500">${name}</td>
      <td><span class="badge" style="${getModeColors(mode)}">${getModeLabel(mode)}</span></td>
      <td style="text-align:center">${s.qty||1}</td>
      <td>${mlDetail}</td>
      <td><span class="wk-tag">${s.week||'—'}</span></td>
      <td style="font-size:12px;color:var(--txt2)">${date}</td>
    </tr>`;
  }).join('')||`<tr><td colspan="6" class="empty">Sin datos en este período</td></tr>`;

  // ── Charts HTML
  const catBars=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([cat,ml])=>{
    const pct=Math.min(100,Math.round((ml/Math.max(...Object.values(byCat),1))*100));
    return`<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="font-size:12px;font-weight:400;color:var(--txt)">${cat}</span>
        <span style="font-size:11px;color:var(--burg);font-weight:500">${fmx(Math.round(ml))} ml</span>
      </div>
      <div style="height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;border:0.5px solid var(--bdr)">
        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--burg),var(--gold));border-radius:4px;transition:width .5s ease"></div>
      </div>
    </div>`;
  }).join('');

  const prodBars=topCocktails.map(([name,{qty,ml}])=>{
    const pct=Math.min(100,Math.round((ml/maxCocktailML)*100));
    return`<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <span style="font-size:12px;color:var(--txt);max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${name}</span>
        <span style="font-size:11px;color:var(--accent);font-weight:500">${fmx(qty)} und · ${fmx(Math.round(ml))} ml</span>
      </div>
      <div style="height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;border:0.5px solid var(--bdr)">
        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--gold),var(--accent-m));border-radius:4px;transition:width .5s ease"></div>
      </div>
    </div>`;
  }).join('');

  const weekBars=weekEntries.map(([wk,qty])=>{
    const pct=Math.min(100,Math.round((qty/maxWkQty)*100));
    return`<div style="display:flex;align-items:flex-end;gap:4px;flex-direction:column;min-width:60px;max-width:80px;flex:1">
      <div style="width:100%;background:var(--bg2);border-radius:4px 4px 0 0;height:80px;display:flex;align-items:flex-end;overflow:hidden;border:0.5px solid var(--bdr)">
        <div style="width:100%;height:${pct}%;background:linear-gradient(180deg,var(--burg2),var(--burg3));border-radius:3px 3px 0 0;transition:height .5s ease"></div>
      </div>
      <div style="font-size:10px;color:var(--txt2);text-align:center;line-height:1.2;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${wk}</div>
      <div style="font-size:10px;color:var(--burg);font-weight:500;text-align:center;width:100%">${qty}</div>
    </div>`;
  }).join('');

  const modePills=Object.entries(byMode).map(([m,qty])=>{
    return`<div style="background:var(--bg);border:0.5px solid var(--bdr2);border-radius:10px;padding:12px 16px;text-align:center;min-width:90px;flex:1">
      <div style="font-size:20px;font-weight:500;font-family:var(--font-serif);color:${modeColors[m]||'var(--txt)'}">${qty}</div>
      <div style="font-size:10px;color:var(--txt2);margin-top:3px;text-transform:uppercase;letter-spacing:.05em">${modeLabels[m]||m}</div>
    </div>`;
  }).join('');

  // ── Contenido de cada pestaña, armado por separado ──
  const tabCompras=`
    ${reorderList.length?`<div class="alert-bar" style="background:rgba(163,45,45,0.07);border-color:rgba(163,45,45,0.25);color:#A32D2D">
      <i class="ti ti-shopping-cart-exclamation" style="font-size:16px"></i>
      <span><b>${reorderList.length} producto(s)</b> con poco stock (barra + bodega) — hay que reponerlos: ${reorderList.slice(0,5).map(s=>s.name).join(', ')}${reorderList.length>5?`… y ${reorderList.length-5} más`:''}</span>
    </div>`:`<div class="alert-bar" style="background:rgba(59,109,17,0.07);border-color:rgba(59,109,17,0.2);color:#3B6D11">
      <i class="ti ti-circle-check" style="font-size:16px"></i>
      <span>Todo el catálogo tiene buen nivel de stock (barra + bodega). Nada urgente que comprar.</span>
    </div>`}
    <div class="card">
      <div class="card-head">
        <span class="card-title"><i class="ti ti-shopping-cart" style="margin-right:6px"></i>Reporte de compras — bajos y agotados</span>
        <div class="export-dropdown" id="export-dropdown-compras">
          <button class="btn btn-coral btn-sm" onclick="toggleExportMenu('compras')" style="display:inline-flex;align-items:center;gap:6px">
            <i class="ti ti-file-type-pdf"></i> Exportar PDF <i class="ti ti-chevron-down"></i>
          </button>
          <div class="export-menu">
            <button class="export-menu-item" onclick="exportBajosPDF();closeExportMenu('compras')">
              <i class="ti ti-list-details"></i>
              <span class="export-menu-item-txt"><span class="export-menu-item-title">Bajos</span><br><span class="export-menu-item-sub">Poco stock en barra y bodega, sin contar agotados</span></span>
              <span class="export-menu-count">${bajosCount}</span>
            </button>
            <button class="export-menu-item is-danger" onclick="exportAgotadosPDF();closeExportMenu('compras')">
              <i class="ti ti-alert-triangle"></i>
              <span class="export-menu-item-txt"><span class="export-menu-item-title">Agotados</span><br><span class="export-menu-item-sub">Stock cero — comprar ya</span></span>
              <span class="export-menu-count">${zeroCount}</span>
            </button>
          </div>
        </div>
      </div>
      <div class="page-sub" style="padding:0 18px;margin:8px 0 0">Considera el stock físico real (barra + bodega). Bajo: 0.50 botellas o menos / 2 piezas o menos, salvo que la bodega tenga respaldo suficiente (más de 1 botella o 2 piezas). "Sugerido comprar" se calcula con el consumo semanal que el sistema detecta en tu historial de ventas.</div>
      <div class="table-scroll" style="max-height:460px;margin-top:10px">
        <table>
          <thead><tr><th>Producto</th><th>Categoría</th><th style="text-align:center">En barra</th><th style="text-align:center">En bodega</th><th style="text-align:center">Total</th><th style="text-align:center">% vs inicial</th><th>Estado</th><th style="text-align:center">Sugerido comprar</th></tr></thead>
          <tbody>${reorderRows}</tbody>
        </table>
      </div>
    </div>`;

  const tabConsumo=`
    <div class="card">
      <div class="card-head"><span class="card-title"><i class="ti ti-trending-up" style="margin-right:6px"></i>Qué se consume más</span>
        <button class="btn btn-coral btn-sm" onclick="exportConsumoPDF()" style="display:inline-flex;align-items:center;gap:6px">
          <i class="ti ti-file-type-pdf"></i> Exportar PDF
        </button>
      </div>
      <div class="page-sub" style="padding:0 18px;margin:8px 0 0">Suma el consumo de esa botella en <b>todas</b> las modalidades: como ingrediente de cócteles (según su receta), shot, copa, botella completa o pieza. · ${consumptionRanking.length} con ventas</div>
      <div class="table-scroll" style="max-height:460px;margin-top:10px">
        <table>
          <thead><tr><th style="text-align:center;width:36px">#</th><th>Producto</th><th>Categoría</th><th>Consumo</th></tr></thead>
          <tbody>${rankingRows}</tbody>
        </table>
      </div>
    </div>`;

  const tabVentas=`
    <!-- FILTROS -->
    <div class="card" style="margin-bottom:14px">
      <div class="card-head"><span class="card-title"><i class="ti ti-filter" style="margin-right:6px"></i>Filtros de período</span>
        <button class="btn btn-coral btn-sm" onclick="exportRepPDF()" style="display:inline-flex;align-items:center;gap:6px">
          <i class="ti ti-file-type-pdf"></i> Exportar PDF
        </button>
      </div>
      <div class="section-p" style="display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end">
        <div>
          <div style="font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;font-weight:500">Tipo de filtro</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            ${[['all','Todos'],['week','Por semana'],['month','Por mes'],['range','Por rango']].map(([v,l])=>`<button class="chip${_repFilterType===v?' active':''}" onclick="setRepFilter('${v}')">${l}</button>`).join('')}
          </div>
        </div>
        ${_repFilterType==='week'?`<div>
          <div style="font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;font-weight:500">Semana</div>
          <select class="sel" style="width:auto;padding:5px 10px;font-size:12px" onchange="setRepWeek(this.value)">
            <option value="">— Seleccionar —</option>${weekOpts}
          </select>
        </div>`:''}
        ${_repFilterType==='month'?`<div>
          <div style="font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;font-weight:500">Mes</div>
          <select class="sel" style="width:auto;padding:5px 10px;font-size:12px" onchange="setRepMonth(this.value)">
            <option value="">— Seleccionar —</option>${monthOpts}
          </select>
        </div>`:''}
        ${_repFilterType==='range'?`
        <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end">
          <div>
            <div style="font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;font-weight:500">Desde</div>
            <input type="date" class="inp" style="padding:5px 10px;font-size:12px;width:auto"
              value="${_repFilterDateFrom}"
              max="${_repFilterDateTo||''}"
              onchange="setRepDateFrom(this.value)">
          </div>
          <div>
            <div style="font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px;font-weight:500">Hasta</div>
            <input type="date" class="inp" style="padding:5px 10px;font-size:12px;width:auto"
              value="${_repFilterDateTo}"
              min="${_repFilterDateFrom||''}"
              onchange="setRepDateTo(this.value)">
          </div>
          ${(_repFilterDateFrom||_repFilterDateTo)?`<button class="btn btn-ghost btn-sm" style="align-self:flex-end" onclick="_repFilterDateFrom='';_repFilterDateTo='';render()"><i class="ti ti-x"></i> Limpiar</button>`:''}
        </div>`:''}
        <div style="margin-left:auto;font-size:12px;color:var(--txt2);align-self:center">
          <span style="font-weight:500;color:var(--burg)">${filtered.length}</span> registros · <span style="font-weight:500;color:var(--burg)">${fmx(Math.round(totalMLAll))} ml</span> consumidos
        </div>
      </div>
    </div>

    <!-- KPIs -->
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px">
      <div class="stat" style="flex:1;min-width:120px"><div class="stat-lbl">Operaciones</div><div class="stat-val">${fmx(filtered.length)}</div></div>
      <div class="stat" style="flex:1;min-width:120px"><div class="stat-lbl">Unidades vendidas</div><div class="stat-val">${fmx(totalOps)}</div></div>
      <div class="stat" style="flex:1;min-width:120px"><div class="stat-lbl">ml consumidos</div><div class="stat-val" style="font-size:22px">${fmx(Math.round(totalMLAll))}</div></div>
      <div class="stat" style="flex:1;min-width:120px"><div class="stat-lbl">Productos únicos</div><div class="stat-val">${Object.keys(byProduct).length}</div></div>
    </div>

    <!-- POR MODALIDAD -->
    ${Object.keys(byMode).length?`<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px">${modePills}</div>`:''}

    <!-- GRÁFICAS -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
      <div class="card">
        <div class="card-head"><span class="card-title">Consumo por categoría (ml)</span></div>
        <div class="section-p" style="height:260px;overflow-y:auto">
          ${catBars||'<div class="empty">Sin datos</div>'}
        </div>
      </div>
      <div class="card">
        <div class="card-head"><span class="card-title">Top de cócteles</span></div>
        <div class="section-p" style="height:260px;overflow-y:auto">
          ${prodBars||'<div class="empty">Sin cócteles vendidos en este periodo</div>'}
        </div>
      </div>
    </div>

    <!-- VENTAS POR SEMANA -->
    ${weekEntries.length?`<div class="card" style="margin-bottom:14px">
      <div class="card-head"><span class="card-title">Operaciones por semana</span></div>
      <div class="section-p" style="overflow-x:auto">
        <div style="display:flex;gap:8px;align-items:flex-end;min-width:max-content;padding:4px 0 8px">
          ${weekBars}
        </div>
      </div>
    </div>`:''}

    <!-- HISTORIAL -->
    <div class="card" id="rep-history-card">
      <div class="card-head"><span class="card-title">Historial completo</span><span class="card-sub">${filtered.length} registros · últimos 100 mostrados</span></div>
      <div class="table-scroll" style="max-height:420px">
        <table>
          <thead><tr><th>Bebida/Producto</th><th>Modalidad</th><th style="text-align:center">Cant.</th><th>ml Consumidos</th><th>Semana</th><th>Fecha</th></tr></thead>
          <tbody>${histRows}</tbody>
        </table>
      </div>
    </div>`;

  const repTabs=[
    ['ventas','Ventas','ti-receipt-2',0],
    ['compras','Compras','ti-shopping-cart',reorderList.length],
    ['consumo','Consumo','ti-trending-up',0],
  ];
  const tabsHTML=`<div class="fl" style="max-width:400px">
    <div class="seg">
      ${repTabs.map(([key,lbl,icon,badge])=>`<button class="${_repTab===key?'active':''}" onclick="setRepTab('${key}')"><i class="ti ${icon}"></i> ${lbl}${badge>0?`<span class="nav-badge" style="margin-left:5px;vertical-align:middle">${badge>99?'99+':badge}</span>`:''}</button>`).join('')}
    </div>
  </div>`;

  const tabContent={ventas:tabVentas, compras:tabCompras, consumo:tabConsumo}[_repTab]||tabVentas;

  return`
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px">
      <div>
        <div class="page-title">Reportes</div>

// ═══════════════════════════════════════════════════════════
// PROVEEDORES — tabla comparativa de precios por botella entre los
// 4 proveedores fijos. Solo consulta/edición de precio; no afecta
// stock, ventas ni ningún otro cálculo del sistema.
// ═══════════════════════════════════════════════════════════
const SUPPLIERS=[
  ['price_wine_club','WINE CLUB'],
  ['price_cava_sautto','CAVA SAUTTO'],
  ['price_cut_wine','CUT WINE'],
  ['price_almacen_victoria','ALMACEN VICTORIA'],
];
const MESES_ES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// ── YYYY-MM-01 del mes calendario real de hoy — este es siempre el único mes editable
function getCurrentMonthStr(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
}
function formatMonthLabel(monthStr){
  const [y,m]=monthStr.split('-').map(Number);
  return `${MESES_ES[m-1]} ${y}`;
}
// Precio de un producto/proveedor en un mes dado — si nunca se capturó ese
// mes (no existe fila), regresa 0 sin necesidad de haber creado el registro.
function getProvPrice(spiritId, month, field){
  const row=supplierPriceHistory.find(r=>r.spirit_id===spiritId && r.month===month);
  return row ? (parseFloat(row[field])||0) : 0;
}

function rProveedores(){
  const cats=[...new Set(spirits.map(s=>s.cat))].sort();
  const catOpts=`<option value="all">Todas</option>`+cats.map(c=>`<option value="${c}"${_provFilter===c?' selected':''}>${c}</option>`).join('');
  const spRaw=_provFilter==='all'?spirits:spirits.filter(s=>s.cat===_provFilter);
  const spList=[...spRaw].sort((a,b)=>a.name.localeCompare(b.name,'es'));

  const currentMonth=getCurrentMonthStr();
  if(!_provMonth) _provMonth=currentMonth;
  const isEditable=_provMonth===currentMonth;
  const isFutureBlocked=_provMonth>currentMonth;
  if(isFutureBlocked) _provMonth=currentMonth; // nunca navegar a un mes futuro que aún no existe

  // Meses disponibles en el selector: solo los que ya tienen algo capturado,
  // más el mes actual siempre presente (aunque todavía esté vacío) para que
  // se pueda empezar a capturar. Nada de meses "fantasma" sin datos.
  const registeredMonths=[...new Set(supplierPriceHistory.map(r=>r.month))];
  if(!registeredMonths.includes(currentMonth)) registeredMonths.push(currentMonth);
  const availableMonths=registeredMonths.sort();
  const monthOpts=availableMonths.map(m=>`<option value="${m}"${m===_provMonth?' selected':''}>${formatMonthLabel(m)}${m===currentMonth?' (actual)':''}</option>`).join('');

  const rows=spList.map(sp=>{
    const priceCells=SUPPLIERS.map(([field])=>{
      const val=getProvPrice(sp.id,_provMonth,field);
      return`<td style="text-align:center">
        <div style="display:flex;align-items:center;justify-content:center;gap:2px">
          <span style="font-size:11px;color:var(--txt3)">$</span>
          ${isEditable
            ? `<input type="number" min="0" step="0.01" value="${val.toFixed(2)}"
                id="prov-${field}-${sp.id}"
                style="width:72px;padding:4px 6px;border:0.5px solid var(--bdr2);border-radius:6px;font-size:12px;font-family:var(--font);text-align:right;background:var(--bg);color:var(--txt)"
                onchange="updateSupplierPriceMonth('${sp.id}','${field}',this.value)">`
            : `<span style="width:72px;display:inline-block;text-align:right;color:var(--txt3);font-size:12px">${val.toFixed(2)}</span>`}
        </div>
      </td>`;
    }).join('');
    return`<tr>
      <td style="font-weight:500">${sp.name}<br><span style="font-size:10px;color:var(--txt3);font-weight:400">${(sp.product_type||'').toUpperCase()}</span></td>
      <td><span style="background:var(--bg2);border-radius:5px;padding:2px 6px;font-size:11px">${sp.cat}</span></td>
      ${priceCells}
    </tr>`;
  }).join('')||`<tr><td colspan="6" class="empty">No hay productos en esta categoría</td></tr>`;

  // Fila de totales: suma cada columna de proveedor sobre la lista filtrada actual, para el mes elegido
  const totalCells=SUPPLIERS.map(([field])=>{
    const total=spList.reduce((t,sp)=>t+getProvPrice(sp.id,_provMonth,field),0);
    return`<td style="text-align:center;font-weight:600;color:var(--burg)">$${total.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}</td>`;
  }).join('');
  const totalRow=`<tr style="background:var(--bg2)">
    <td style="font-weight:600" colspan="2">Total (${spList.length} referencias)</td>
    ${totalCells}
  </tr>`;

  const tabMensualActive=_provTab!=='anual';
  const monthTabHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;background:var(--bg2);border:0.5px solid var(--bdr);border-radius:var(--r);padding:8px 12px">
      <label style="font-size:11px;color:var(--txt2);white-space:nowrap">Mes:</label>
      <select class="sel" style="width:auto;padding:5px 9px;font-size:12px;font-family:var(--font-serif);color:var(--burg)" onchange="_provMonth=this.value;render()">${monthOpts}</select>
      ${isEditable
        ?`<span style="font-size:10px;background:rgba(59,109,17,0.12);color:#3B6D11;padding:3px 8px;border-radius:20px;font-weight:500;white-space:nowrap">Mes actual · editable</span>`
        :`<span style="font-size:10px;background:rgba(168,147,122,0.18);color:var(--txt2);padding:3px 8px;border-radius:20px;font-weight:500;white-space:nowrap"><i class="ti ti-lock" style="font-size:10px;vertical-align:-1px"></i> Histórico · solo lectura</span>`}
    </div>
    <div class="card">
      <div class="table-scroll">
        <table style="table-layout:fixed;width:100%">
          <colgroup>
            <col style="width:200px"><col style="width:110px">
            <col style="width:130px"><col style="width:130px"><col style="width:130px"><col style="width:150px">
          </colgroup>
          <thead><tr>
            <th>Línea de producto</th>
            <th>Categoría</th>
            ${SUPPLIERS.map(([,label])=>`<th style="text-align:center">${label}</th>`).join('')}
          </tr></thead>
          <tbody>${rows}</tbody>
          <tfoot>${totalRow}</tfoot>
        </table>
      </div>
    </div>
    <div style="margin-top:10px;font-size:10.5px;color:var(--txt3)"><i class="ti ti-lock" style="font-size:12px;vertical-align:-1px"></i> Los meses pasados quedan bloqueados de solo lectura automáticamente en cuanto cambia el mes calendario.</div>`;

  const annualHTML=renderProvComparativaAnual();

  return`
    <div class="page-title">Proveedores</div>
    <div class="page-sub">Historial mensual de precios por botella · Captura lo que te cobra cada proveedor para comparar antes de comprar. No afecta el stock ni ningún otro cálculo del sistema.</div>
    <div class="toolbar" style="justify-content:space-between">
      <div style="display:flex;align-items:center;gap:10px">
        <label style="font-size:12px;color:var(--txt2)">Filtrar familia:</label>
        <select class="sel" style="width:auto;padding:5px 9px;font-size:12px" onchange="_provFilter=this.value;render()">${catOpts}</select>
        <span style="font-size:12px;color:var(--txt2)">${spList.length} referencias</span>
      </div>
      <div style="display:flex;background:var(--bg2);padding:3px;border-radius:var(--r);gap:2px;border:0.5px solid var(--bdr)">
        <button onclick="_provTab='mensual';render()" style="padding:6px 14px;font-size:11px;border:none;border-radius:6px;font-family:var(--font);cursor:pointer;background:${tabMensualActive?'var(--burg)':'none'};color:${tabMensualActive?'var(--gold2)':'var(--txt2)'};font-weight:${tabMensualActive?'500':'400'}">Captura mensual</button>
        <button onclick="_provTab='anual';render()" style="padding:6px 14px;font-size:11px;border:none;border-radius:6px;font-family:var(--font);cursor:pointer;background:${!tabMensualActive?'var(--burg)':'none'};color:${!tabMensualActive?'var(--gold2)':'var(--txt2)'};font-weight:${!tabMensualActive?'500':'400'}">Comparativa anual</button>
      </div>
    </div>
    ${tabMensualActive?monthTabHTML:annualHTML}`;
}

// ── Comparativa anual: gasto total mensual por proveedor, sumando todo el catálogo
function renderProvComparativaAnual(){
  const months=[...new Set(supplierPriceHistory.map(r=>r.month))].sort();
  if(!months.length){
    return`<div class="card" style="padding:24px;text-align:center;color:var(--txt3);font-size:12px">Aún no hay precios capturados en ningún mes.</div>`;
  }

  // Selector de producto: "Todo el catálogo" (acumulado) o una botella específica
  // para ver su tendencia de precio mes a mes y detectar cuándo estuvo más barata.
  const spRaw=_provFilter==='all'?spirits:spirits.filter(s=>s.cat===_provFilter);
  const spConHistorial=[...spRaw].filter(s=>supplierPriceHistory.some(r=>r.spirit_id===s.id)).sort((a,b)=>a.name.localeCompare(b.name,'es'));
  const productSelectorHTML=`
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;background:var(--bg2);border:0.5px solid var(--bdr);border-radius:var(--r);padding:8px 12px">
      <i class="ti ti-chart-line" style="color:var(--gold);font-size:15px"></i>
      <label style="font-size:11px;color:var(--txt2);white-space:nowrap">Ver:</label>
      <select class="sel" style="width:auto;flex:1;max-width:280px;padding:6px 10px;font-size:12.5px;font-family:var(--font-serif);color:var(--burg);font-weight:500;border-color:var(--bdr2);background:var(--bg)" onchange="_provChartProduct=this.value;render()">
        <option value="all"${_provChartProduct==='all'?' selected':''}>Todo el catálogo (acumulado)</option>
        ${spConHistorial.map(s=>`<option value="${s.id}"${_provChartProduct===s.id?' selected':''}>${s.name}</option>`).join('')}
      </select>
    </div>`;

  if(!spConHistorial.length){
    return productSelectorHTML+`<div class="card" style="padding:24px;text-align:center;color:var(--txt3);font-size:12px">Ningún producto de esta categoría tiene precios capturados todavía.</div>`;
  }
  // Si el producto elegido ya no tiene historial (cambiaste de filtro, etc.) regresa al acumulado
  if(_provChartProduct!=='all' && !spConHistorial.some(s=>s.id===_provChartProduct)) _provChartProduct='all';

  const chartHTML=_provChartProduct==='all'
    ? renderProvChartAcumulado(months)
    : renderProvChartProducto(_provChartProduct, months);

  return productSelectorHTML+`<div class="card" style="padding:16px">${chartHTML}</div>`;
}

// ── Vista acumulada: gasto mensual total por proveedor, sumando todo el catálogo filtrado
function renderProvChartAcumulado(months){
  const totals=months.map(m=>{
    const rowsMonth=supplierPriceHistory.filter(r=>r.month===m);
    return SUPPLIERS.map(([field])=>rowsMonth.reduce((t,r)=>t+(parseFloat(r[field])||0),0));
  });
  const maxVal=Math.max(1,...totals.flat());
  const colors=['#6B1F2A','#B8935A','#8a9a7a','#a8937a'];
  const groupW=Math.max(90,600/Math.max(1,months.length));
  const barW=Math.min(20,(groupW-16)/4);
  const maxBarH=105; // se deja espacio arriba para las etiquetas de valor
  let bars='', xlabels='';
  totals.forEach((month,mi)=>{
    month.forEach((val,pi)=>{
      const h=maxVal>0?(val/maxVal)*maxBarH:0;
      const x=50+mi*groupW+pi*(barW+2);
      const y=170-h;
      const label=SUPPLIERS[pi][1];
      const fmtVal=val.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
      bars+=`<rect x="${x}" y="${y}" width="${barW}" height="${h}" fill="${colors[pi]}" rx="2" style="cursor:pointer"><title>${label} — ${formatMonthLabel(months[mi])}: $${fmtVal}</title></rect>`;

    const totalMes=month.reduce((t,v)=>t+v,0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
    xlabels+=`<text x="${50+mi*groupW+groupW/2-10}" y="185" font-size="10" fill="#6B5A46" text-anchor="middle" style="cursor:pointer"><title>${formatMonthLabel(months[mi])} — Total combinado: $${totalMes}</title>${formatMonthLabel(months[mi]).split(' ')[0].slice(0,3)}</text>`;

}

// ── Vista por producto: línea de precio de UNA botella a través de los meses,
// una línea por proveedor, para detectar en qué mes/proveedor estuvo más barata.
// Un precio en 0 significa "no capturado ese mes" — no se dibuja ese punto,
// para no confundirlo con que de verdad costó $0.
function renderProvChartProducto(spiritId, months){
  const sp=spirits.find(s=>s.id===spiritId);
  const colors=['#6B1F2A','#B8935A','#8a9a7a','#a8937a'];
  const w=600,h=220,padL=45,padR=15,padT=32,padB=35;
  const plotW=w-padL-padR, plotH=h-padT-padB;

  const series=SUPPLIERS.map(([field])=>{
    return months.map((m,mi)=>{
      const row=supplierPriceHistory.find(r=>r.spirit_id===spiritId && r.month===m);
      const val=row?(parseFloat(row[field])||0):0;
      return val>0?{mi,val}:null;
    }).filter(Boolean);
  });
  const allVals=series.flat().map(p=>p.val);
  if(!allVals.length){
    return`<div style="font-size:11px;color:var(--txt2);margin-bottom:10px">${sp.name}</div><div style="padding:24px;text-align:center;color:var(--txt3);font-size:12px">Aún no hay precios capturados para este producto en ningún mes.</div>`;
  }
  const maxVal=Math.max(...allVals)*1.15;
  const xStep=months.length>1?plotW/(months.length-1):0;
  const xFor=mi=>padL+(months.length>1?mi*xStep:plotW/2);
  const yFor=val=>padT+plotH-(val/maxVal)*plotH;

  let lines='',dots='',xlabels='';
  series.forEach((pts,pi)=>{
    if(pts.length){
      const d=pts.map((p,i)=>`${i===0?'M':'L'}${xFor(p.mi).toFixed(1)},${yFor(p.val).toFixed(1)}`).join(' ');
      lines+=`<path d="${d}" fill="none" stroke="${colors[pi]}" stroke-width="2"></path>`;
      pts.forEach(p=>{
        const fmtVal=p.val.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
        const cx=xFor(p.mi).toFixed(1), cy=yFor(p.val).toFixed(1);
        dots+=`<circle cx="${cx}" cy="${cy}" r="4" fill="${colors[pi]}" style="cursor:pointer"><title>${SUPPLIERS[pi][1]} — ${formatMonthLabel(months[p.mi])}: $${fmtVal}</title></circle>`;
        dots+=`<text x="${cx}" y="${yFor(p.val)-8-(pi%2)*11}" font-size="9" fill="${colors[pi]}" text-anchor="middle">$${fmtVal}</text>`;
      });
    }
  });
  months.forEach((m,mi)=>{
    xlabels+=`<text x="${xFor(mi).toFixed(1)}" y="${h-10}" font-size="10" fill="#6B5A46" text-anchor="middle">${formatMonthLabel(m).split(' ')[0].slice(0,3)}</text>`;
  });

  let best=null;
  series.forEach((pts,pi)=>{ pts.forEach(p=>{ if(!best||p.val<best.val) best={val:p.val,pi,mi:p.mi}; }); });
  const bestHTML=best?`<div style="margin-top:10px;background:rgba(59,109,17,0.08);border:0.5px solid rgba(59,109,17,0.2);border-radius:var(--r);padding:8px 12px;font-size:11.5px;color:#3B6D11"><i class="ti ti-trending-down" style="vertical-align:-2px"></i> Precio más bajo detectado: <b>$${best.val.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2})}</b> — ${SUPPLIERS[best.pi][1]}, ${formatMonthLabel(months[best.mi])}</div>`:'';

  const legend=SUPPLIERS.map(([,label],i)=>`<div style="display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--txt2)"><span style="width:9px;height:9px;background:${colors[i]};border-radius:2px;display:inline-block"></span>${label}</div>`).join('');
  return`
    <div style="font-size:11px;color:var(--txt2);margin-bottom:10px">Precio de <b style="color:var(--txt)">${sp.name}</b> por proveedor, mes a mes</div>
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px">
      <line x1="${padL}" y1="${padT+plotH}" x2="${w-padR}" y2="${padT+plotH}" stroke="var(--bdr2)" stroke-width="1"></line>
      ${lines}
      ${dots}
      ${xlabels}
    </svg>
    <div style="display:flex;gap:16px;margin-top:8px;flex-wrap:wrap">${legend}</div>
    ${bestHTML}`;
}

function exportRepPDF(){
  const filtered=getRepFilteredSales();
  if(!filtered.length){alert('No hay datos para exportar en el período seleccionado.');return;}

  const totalMLAll=filtered.reduce((t,s)=>{
    const mode=s.sale_mode||'coctel';
    if(mode==='coctel'){const r=recipes.find(r=>r.id===s.cocktail_id);if(!r)return t;return t+r.ings.reduce((m,i)=>m+(s.qty||1)*i.ml,0);}
    if(mode==='shot') return t+(s.qty||1)*60;
    if(mode==='copa') return t+(s.qty||1)*150;
    if(mode==='botella'||mode==='pieza'){const sp=spirits.find(x=>x.id===s.cocktail_id);return t+(sp?(s.qty||1)*sp.ml:0);}

function toggleExportMenu(id){
  const el=document.getElementById('export-dropdown-'+id);
  if(!el) return;
  const willOpen=!el.classList.contains('open');
  document.querySelectorAll('.export-dropdown.open').forEach(d=>d.classList.remove('open'));
  if(willOpen) el.classList.add('open');
}
function closeExportMenu(id){
  const el=document.getElementById('export-dropdown-'+id);
  if(el) el.classList.remove('open');
}

  document.querySelectorAll('.export-dropdown.open').forEach(d=>{
    if(!d.contains(e.target)) d.classList.remove('open');
  });
});

async function addSale(){
  // ── RBAC guard: lector y bartender solo pueden ver, no registrar ventas
  if(!currentUser){alert('Sesión no iniciada.');return;}
  if(currentUser.role==='lector'||currentUser.role==='bartender'){alert('Tu rol solo tiene permiso de lectura.');return;}

  const week=(document.getElementById('s-wk')?.value||'').trim();
  const coVal=document.getElementById('s-co')?.value||'';
  const qty=parseInt(document.getElementById('s-qty')?.value)||0;

  if(!week){alert('Por favor especifica la semana operativa (ej: Semana 21).');return;}
  if(!coVal||qty<=0){alert('Selecciona un producto y una cantidad válida.');return;}

  // Parse the composite value: "recipe::ID" or "spirit::ID"
  let cocktail_id=null;
  if(coVal.startsWith('recipe::')){cocktail_id=coVal.replace('recipe::','');}
  else if(coVal.startsWith('spirit::')){cocktail_id=coVal.replace('spirit::','');}
  else{cocktail_id=coVal;}

  const sale_mode=_saleMode;

  const btn=document.getElementById('btn-save');
  if(btn){btn.disabled=true;btn.innerHTML='<i class="ti ti-loader-2"></i> Confirmando...';}

  // Registro provisional en memoria PRIMERO (igual que el comportamiento anterior):
  // así el snapshot de stock que se guarda ya refleja el consumo de esta venta.
  const provisionalId='tmp-'+Date.now();
  reportHistory.unshift({ id:provisionalId, cocktail_id, qty, week, sale_mode, created_at:new Date().toISOString(), registered_by:currentUser?.id||null });

  // 🛡️ Control de mermas: foto del inventario líquido justo después de esta venta
  const stock_snapshot=JSON.stringify(
    spirits.map(sp=>{
      const barraStock=getEffectiveBarraStock(sp);
      const remainingBarraUnits=Math.max(0, barraStock - (getConsumedML(sp.id) / sp.ml) - getConsumedUnits(sp.id));
      return {
        id: sp.id,
        name: sp.name,
        stock_barra: barraStock,
        stock_bodega: getEffectiveBodegaStock(sp),
        ml: sp.ml,
        remaining_barra: remainingBarraUnits,
        remaining_ml: Math.round(remainingBarraUnits * sp.ml)
      };
    })
  );

  const {data,error}=await sb.from('report_history').insert({cocktail_id,qty,week,sale_mode,registered_by:currentUser?.id||null,stock_snapshot}).select();

  if(error){
    reportHistory=reportHistory.filter(r=>r.id!==provisionalId); // revertir el registro provisional
    alert('Error al guardar en Supabase: '+error.message);
    if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-plus"></i> Registrar operación';}
    return;
  }
  // Sustituir el provisional por el registro real de Supabase (id/created_at definitivos)
  const idx=reportHistory.findIndex(r=>r.id===provisionalId);
  const finalRecord={
    ...data[0],
    registered_by_name: currentUser?.full_name||'',
    registered_by_email: currentUser?.email||''
  };
  if(idx>=0) reportHistory[idx]=finalRecord; else reportHistory.unshift(finalRecord);

  syncSalesView();
  _weekInput='';
  updatePill();
  render();
}

async function delSale(id){
  // ── RBAC guard: solo admin y manager pueden eliminar ventas. Bartender
  // solo puede registrar, no borrar (evita que revierta stock por su cuenta).
  if(!currentUser){alert('Sesión no iniciada.');return;}
  if(currentUser.role==='lector'||currentUser.role==='bartender'){alert('Tu rol no tiene permiso para eliminar ventas.');return;}
  if(!confirm('Esta venta se eliminará PERMANENTEMENTE de la base de datos y no se podrá recuperar. ¿Deseas continuar?')) return;
  // Borrado real: se elimina la fila de report_history. A partir de ahora
  // el consumo/stock SÍ se recalcula sin esta venta (ya no hay "borrado suave").
  const {data,error}=await sb.from('report_history').delete().eq('id',id).select();
  if(error){alert('Error al eliminar: '+error.message);return;}
  if(!data||data.length===0){
    // 0 filas afectadas sin error explícito = casi siempre un problema de
    // permisos (RLS) en Supabase — avisamos en vez de fallar en silencio.
    alert('No se pudo eliminar la venta: Supabase no encontró o no autorizó el borrado de ese registro (revisa los permisos RLS de DELETE en report_history).');
    return;
  }
  reportHistory=reportHistory.filter(r=>r.id!==id);
  syncSalesView();
  updatePill();
  render();
}

// ── PROVEEDORES: guardar el precio que cobra un proveedor por una botella,
// para el mes actualmente seleccionado (siempre el mes calendario real).
// Usa upsert: si ya existe fila para ese producto+mes, solo actualiza esa
// columna (sin tocar los otros 3 proveedores); si no existe, la crea con
// esta única columna (las otras 3 quedan en 0 hasta que se capturen).
// Si al guardar los 4 proveedores quedan en 0, se BORRA la fila en vez de
// dejarla guardada vacía — para no ocupar espacio con registros inútiles.
async function updateSupplierPriceMonth(id, field, value){
  if(!currentUser){alert('Sesión no iniciada.');return;}
  if(currentUser.role==='lector'||currentUser.role==='manager'){alert('Tu rol solo tiene permiso de lectura.');return;}
  const sp=spirits.find(s=>s.id===id);
  if(!sp) return;
  const price=parseFloat(value);
  if(isNaN(price)||price<0){alert('Precio inválido. Debe ser un número mayor o igual a 0.');return;}
  const rounded=parseFloat(price.toFixed(2));
  const month=_provMonth;
  const inputEl=document.getElementById(`prov-${field}-${id}`);

  // Calcular cómo quedaría la fila completa después de este cambio, para
  // decidir si hay que borrarla (los 4 proveedores en 0) o guardarla.
  const existing=supplierPriceHistory.find(r=>r.spirit_id===id && r.month===month);
  const resulting={};
  SUPPLIERS.forEach(([f])=>{ resulting[f]=f===field?rounded:(existing?(parseFloat(existing[f])||0):0); });
  const allZero=SUPPLIERS.every(([f])=>resulting[f]===0);

  if(allZero){
    if(existing){
      const {error}=await sb.from('supplier_price_history').delete().eq('spirit_id',id).eq('month',month);
      if(error){
        alert('Error al borrar el registro vacío en Supabase: '+error.message);
        if(inputEl) inputEl.value=getProvPrice(id,month,field).toFixed(2);
        return;
      }
      supplierPriceHistory=supplierPriceHistory.filter(r=>!(r.spirit_id===id && r.month===month));
    }
    // Si no existía fila y el valor capturado es 0, no hay nada que guardar ni borrar.
  } else {
    const {data,error}=await sb.from('supplier_price_history')
      .upsert({spirit_id:id, month, [field]:rounded, updated_by:currentUser?.id||null}, {onConflict:'spirit_id,month'})
      .select();

    if(error){
      alert('Error al guardar el precio en Supabase: '+error.message);
      if(inputEl) inputEl.value=getProvPrice(id,month,field).toFixed(2); // revertir a lo último guardado
      return;
    }
    // Actualizar en memoria sin recargar toda la tabla
    const idx=supplierPriceHistory.findIndex(r=>r.spirit_id===id && r.month===month);
    if(data && data[0]){
      if(idx>=0) supplierPriceHistory[idx]=data[0]; else supplierPriceHistory.push(data[0]);
    } else if(idx>=0){
      supplierPriceHistory[idx][field]=rounded;
    } else {
      supplierPriceHistory.push({spirit_id:id, month, price_wine_club:0, price_cava_sautto:0, price_cut_wine:0, price_almacen_victoria:0, [field]:rounded});
    }
  }

  if(inputEl){
    inputEl.value=rounded.toFixed(2);
    inputEl.style.borderColor='#3B6D11'; // breve confirmación visual, reutilizando el verde ya usado en el sistema
    setTimeout(()=>{ if(inputEl) inputEl.style.borderColor=''; }, 700);
  }
}

async function adjustStock(id, amount){
  // ── RBAC guard: solo admin puede ajustar stock
  if(!currentUser){alert('Sesión no iniciada.');return;}
  if(currentUser.role!=='admin'){
    alert('Solo el administrador puede ajustar el stock.');return;
  }
  const sp=spirits.find(s=>s.id===id);
  if(!sp) return;
  // ── El campo que se ajusta depende de la pestaña activa del catálogo (Barra/Bodega/Bonificaciones)
  const field=_catLoc==='bodega'?'stock_bodega':(_catLoc==='bonificaciones'?'stock_bonificaciones':'stock_barra');
  const locLabel=_catLoc==='bodega'?'bodega':(_catLoc==='bonificaciones'?'bonificaciones':'barra');
  // Asegurar que amount sea número flotante, nunca NaN ni 0
  const delta=parseFloat(parseFloat(amount).toFixed(2));
  if(isNaN(delta)||delta===0){alert('Cantidad inválida.');return;}
  const current=parseFloat(sp[field])||0;
  const newStock=parseFloat((current+delta).toFixed(2));
  if(newStock<0){alert(`El stock de ${locLabel} no puede ser negativo. Stock actual: `+current.toFixed(2));return;}
  // Feedback visual inmediato
  const btns=document.querySelectorAll(`button[onclick*="adjustStock('${id}'"]`);
  btns.forEach(b=>{b.disabled=true;});
  const {data, error}=await sb.from('spirits').update({[field]:newStock}).eq('id',id).select();
  if(error){
    alert('Error al guardar en Supabase: '+error.message+'\n\nVerifica que las políticas RLS permitan UPDATE a tu rol, y que la columna "'+field+'" exista en la tabla spirits.');
    btns.forEach(b=>{b.disabled=false;});
    return;
  }
  // Actualizar en memoria solo si Supabase confirma
  if(data && data[0]) sp[field]=data[0][field];
  else sp[field]=newStock;

  // ── Registrar en el historial CUALQUIER ajuste físico (alta o descuento),
  // para que siempre haya un rastro completo y explicable del stock actual.
  // Antes solo se registraban las altas (delta>0), lo que dejaba los
  // descuentos manuales sin ningún registro — causa de descuadres invisibles.
  const {data:seData, error:seErr}=await sb.from('stock_entries')
    .insert({spirit_id:id, location:_catLoc, qty:delta, created_by:currentUser?.id||null})
    .select();
  if(seErr){
    console.warn('⚠️ No se pudo registrar el ajuste en el historial:', seErr.message);
  } else if(seData && seData[0]){
    stockEntries.unshift({...seData[0], created_by_name:currentUser?.full_name||'', created_by_email:currentUser?.email||''});
  }
  render();
}

// ═══════════════════════════════════════════════════════════
// TRASPASO MANUAL — Bodega → Barra
// Mueve una cantidad puntual del stock de bodega hacia la barra,
// insertando un registro en la tabla `transfers` (misma fuente
// permanente que ya usa getTransferredIn para calcular el stock
// efectivo). No modifica stock_barra/stock_bodega directamente:
// ambos catálogos se recalculan solos a partir de este registro.
// ═══════════════════════════════════════════════════════════
async function transferToBarra(id, amount){
  // ── RBAC guard: mismo criterio que el ajuste de stock — solo admin
  if(!currentUser){alert('Sesión no iniciada.');return;}
  if(currentUser.role!=='admin'){
    alert('Solo el administrador puede mover stock entre catálogos.');return;
  }
  const sp=spirits.find(s=>s.id===id);
  if(!sp) return;

  const delta=parseFloat(parseFloat(amount).toFixed(2));
  if(isNaN(delta)||delta<0.01){alert('Cantidad inválida. Debe ser de al menos 0.01 para que valga la pena registrar el traspaso.');return;}

  const available=getEffectiveBodegaStock(sp);
  if(delta>available+1e-9){
    alert(`Solo hay ${available.toFixed(2)} disponible en bodega de "${sp.name}". No puedes mover ${delta.toFixed(2)}.`);
    return;
  }
  if(!confirm(`¿Mover ${delta.toFixed(2)} de "${sp.name}" de bodega a barra?`)) return;

  // Feedback visual inmediato
  const btns=document.querySelectorAll(`button[onclick*="transferToBarra('${id}'"]`);
  const originalHTML=btns.length?btns[0].innerHTML:'';
  btns.forEach(b=>{b.disabled=true;b.innerHTML='<i class="ti ti-loader-2"></i> Moviendo...';});

  const {data, error}=await sb.from('transfers').insert({spirit_id:id, qty:delta, created_by:currentUser?.id||null}).select();

  if(error){
    alert('Error al guardar el traspaso en Supabase: '+error.message+'\n\nVerifica que la tabla "transfers" exista y que las políticas RLS permitan INSERT a tu rol.');
    btns.forEach(b=>{b.disabled=false;b.innerHTML=originalHTML;});
    return;
  }

  if(data && data[0]){
    transfers.unshift({...data[0], created_by_name:currentUser?.full_name||'', created_by_email:currentUser?.email||''});
  } else {
    // Supabase no devolvió la fila creada (típico cuando falta política RLS de SELECT
    // sobre "transfers", aunque el INSERT sí haya funcionado). Se refleja igual en
    // esta sesión, pero conviene revisar las políticas para que persista al recargar.
    console.warn('⚠️ El traspaso se guardó pero Supabase no devolvió la fila — revisa que "transfers" tenga política RLS de SELECT para tu rol, o no se verá al recargar la página.');
    transfers.unshift({id:'tmp-'+Date.now(), spirit_id:id, qty:delta, created_by:currentUser?.id||null, created_at:new Date().toISOString(), created_by_name:currentUser?.full_name||'', created_by_email:currentUser?.email||''});
  }
  render();
}

// ── Login con email + password
async function login(){
  const email=(document.getElementById('login-email')?.value||'').trim();
  const pass=(document.getElementById('login-pass')?.value||'');
  const btn=document.getElementById('login-btn');
  const errEl=document.getElementById('login-error');
  if(!email||!pass){_showLoginError('Ingresa tu correo y contraseña.');return;}
  btn.disabled=true;btn.innerHTML='<i class="ti ti-loader-2"></i> Verificando...';
  errEl.classList.remove('show');

// ── Carga el perfil del usuario desde la tabla profiles
async function _loadProfile(user){
  const {data:profile,error}=await sb.from('profiles').select('*').eq('id',user.id).single();

  if(error){
    // PGRST116 = fila no encontrada (usuario nuevo sin perfil) → crear como bartender
    if(error.code==='PGRST116'){
      const {data:created}=await sb.from('profiles')
        .upsert({id:user.id,email:user.email,role:'bartender'},{onConflict:'id'})
        .select().single();
      currentUser={id:user.id,email:user.email,role:(created?.role||'bartender'),full_name:''};
    } else {
      // Error real (RLS, red, etc.) — NO asumir bartender, mostrar error
      console.error('❌ Error al leer profiles:', error.code, error.message);
      _showLoginError('Error al cargar tu perfil ('+error.code+'). Revisa que la tabla profiles tenga RLS correctamente configurado.');
      await sb.auth.signOut();
      const btn=document.getElementById('login-btn');
      if(btn){btn.disabled=false;btn.innerHTML='<i class="ti ti-lock-open" style="margin-right:6px"></i>Iniciar sesión';}
      return; // ← sale sin cargar la app
    }
  } else {
    // Éxito: usar exactamente el rol que viene de Supabase
    currentUser={id:profile.id,email:profile.email,role:profile.role,full_name:profile.full_name||''};
  }

  console.log('✅ Sesión iniciada como:', currentUser.email, '| Rol:', currentUser.role);
  _hideOverlay();
  _updateUserBadge();
  await loadAll();
}

// ── applyRoleUI: oculta/muestra elementos DOM según el rol
// Se llama automáticamente al final de cada render()
function applyRoleUI(){
  if(!currentUser) return;
  const role=currentUser.role; // 'admin' | 'manager' | 'bartender' | 'lector'

  // ════════════════════════════════════════════
  // NAV BUTTONS
  // idx: 0=dash 1=ventas 2=recetas 3=catalogo 4=reportes 5=proveedores
  // ════════════════════════════════════════════
  const navBtns=[...document.querySelectorAll('.nav-btn')];
  const navVisible={
    admin:    [0,1,2,3,4,5],
    manager:  [0,1,2,3,4,5],
    bartender:[0,1,2,3],
    lector:   [0,1,2,3,4,5]   // ve todo excepto acciones — igual que manager en nav
  }[role] || [0,1,2,3,4,5];

  navBtns.forEach((btn,i)=>{
    btn.style.display=navVisible.includes(i)?'flex':'none';
  });

  // ════════════════════════════════════════════
  // NAV LABELS — ocultar si no hay botones visibles en esa sección
  // ════════════════════════════════════════════
  const navLbls=[...document.querySelectorAll('.nav-lbl')];
  navLbls.forEach(lbl=>{lbl.style.display='';});  // reset
  if(role==='bartender'){
    if(navLbls[2]) navLbls[2].style.display='none'; // oculta label "Análisis"
  }

  // ════════════════════════════════════════════
  // BOTÓN "+ Registrar operación"
  // Lector y bartender solo pueden VER las ventas, no registrar
  // ════════════════════════════════════════════
  const btnSave=document.getElementById('btn-save');
  if(btnSave){
    btnSave.style.display=(role==='lector'||role==='bartender')?'none':'';
  }

  // ════════════════════════════════════════════
  // BOTONES ELIMINAR VENTA (trash)
  // Solo admin y manager pueden borrar. Bartender solo ve, no borra.
  // ════════════════════════════════════════════
  document.querySelectorAll('button[onclick*="delSale"]').forEach(btn=>{
    btn.style.display=(role==='lector'||role==='bartender')?'none':'';
  });

  // ════════════════════════════════════════════
  // BOTONES AJUSTE STOCK (+/-) en catálogo
  // Solo admin puede ajustar stock — manager, bartender y lector solo ven
  // ════════════════════════════════════════════
  document.querySelectorAll('button[onclick*="adjustStock"]').forEach(btn=>{
    btn.style.display=(role!=='admin')?'none':'';
  });
  // También ocultar el input de cantidad si no es admin
  document.querySelectorAll('input[id^="adj-"]').forEach(inp=>{
    inp.style.display=(role!=='admin')?'none':'';
  });

  // ════════════════════════════════════════════
  // BOTÓN "Mover a Barra" (traspaso bodega → barra)
  // Solo admin puede mover stock entre catálogos
  // ════════════════════════════════════════════
  document.querySelectorAll('button[onclick*="transferToBarra"]').forEach(btn=>{
    btn.style.display=(role!=='admin')?'none':'';
  });
  document.querySelectorAll('input[id^="mv-"]').forEach(inp=>{
    inp.style.display=(role!=='admin')?'none':'';
  });

  // ════════════════════════════════════════════
  // BOTÓN "Mover a Barra" desde Bonificaciones (traspaso bonificaciones → barra)
  // Solo admin puede mover stock entre catálogos
  // ════════════════════════════════════════════
  document.querySelectorAll('button[onclick*="transferBonifToBarra"]').forEach(btn=>{
    btn.style.display=(role!=='admin')?'none':'';
  });
  document.querySelectorAll('input[id^="mvb-"]').forEach(inp=>{
    inp.style.display=(role!=='admin')?'none':'';
  });

  // ════════════════════════════════════════════
  // PROVEEDORES: precios visibles para todos los que llegan a esta pestaña,
  // pero solo admin puede editarlos — manager y lector los ven en solo lectura
  // ════════════════════════════════════════════
  document.querySelectorAll('input[id^="prov-"]').forEach(inp=>{
    inp.disabled=(role==='lector'||role==='manager');
    inp.style.opacity=(role==='lector'||role==='manager')?'0.6':'';
    inp.style.cursor=(role==='lector'||role==='manager')?'not-allowed':'';
  });
}
